server:
  port: 4004

auth:
  service:
    url: ${AUTH_SERVICE_URL}

appointment:
  service:
    url: ${APPOINTMENT_SERVICE_URL}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        - id: authenticated-public-booking-route
          uri: ${APPOINTMENT_SERVICE_URL}
          predicates:
            - Path=/public/booking/*/appointments/**
          filters:
            - JwtValidation

        - id: public-booking-route
          uri: ${APPOINTMENT_SERVICE_URL}
          predicates:
            - Path=/public/booking/**

        - id: appointment-service-route
          uri: ${APPOINTMENT_SERVICE_URL}
          predicates:
            - Path=/api/appointments/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: customer-portal-route
          uri: ${APPOINTMENT_SERVICE_URL}
          predicates:
            - Path=/api/customer/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: api-docs-appointment-route
          uri: ${APPOINTMENT_SERVICE_URL}
          predicates:
            - Path=/api-docs/appointments
          filters:
            - RewritePath=/api-docs/appointments,/v3/api-docs

        - id: api-docs-auth-route
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs
