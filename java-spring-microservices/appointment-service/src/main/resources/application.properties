#spring.datasource.driver-class-name=org.h2.Driver
#
#spring.datasource.username=admin_viewer
#spring.datasource.password=password
#
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
#spring.sql.init.mode=always

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server.port=4000
logging.level.root=info
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/payment/cancelled}
stripe.webhook-secret=${STRIPE_APPOINTMENT_WEBHOOK_SECRET:}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:4005}
internal.service-key=${INTERNAL_SERVICE_KEY:}
# Minutes reserved before and after each appointment for staff, customer, and resource turnover.
appointment.booking-buffer-minutes=${APPOINTMENT_BOOKING_BUFFER_MINUTES:0}
appointment.event-outbox-max-attempts=${APPOINTMENT_EVENT_OUTBOX_MAX_ATTEMPTS:10}
appointment.event-outbox-retention-days=${APPOINTMENT_EVENT_OUTBOX_RETENTION_DAYS:7}
appointment.event-outbox-cleanup-cron=${APPOINTMENT_EVENT_OUTBOX_CLEANUP_CRON:0 0 * * * *}
# Authoritative timezone used by public booking when no tenant-specific profile service is available.
public-booking.timezone=${PUBLIC_BOOKING_TIMEZONE:UTC}
