spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server.port=4000
logging.level.root=info
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/payment/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/payment/cancelled}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:4005}
internal.service-key=${INTERNAL_SERVICE_KEY:}
