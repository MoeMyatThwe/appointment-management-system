spring.application.name=auth-service
server.port=4005
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUBSCRIPTION_SUCCESS_URL:http://localhost:5173/billing?success=true}
stripe.cancel-url=${STRIPE_SUBSCRIPTION_CANCEL_URL:http://localhost:5173/billing?cancelled=true}
internal.service-key=${INTERNAL_SERVICE_KEY:}
recovery.expose-development-token=${RECOVERY_EXPOSE_DEVELOPMENT_TOKEN:false}
platform.admin.email=${PLATFORM_ADMIN_EMAIL:}
platform.admin.password=${PLATFORM_ADMIN_PASSWORD:}
