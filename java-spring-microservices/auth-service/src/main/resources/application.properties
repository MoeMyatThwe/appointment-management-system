spring.application.name=auth-service
server.port=4005
jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUBSCRIPTION_SUCCESS_URL:http://localhost:5173/billing?success=true}
stripe.cancel-url=${STRIPE_SUBSCRIPTION_CANCEL_URL:http://localhost:5173/billing?cancelled=true}
internal.service-key=${INTERNAL_SERVICE_KEY:}
recovery.expose-development-token=${RECOVERY_EXPOSE_DEVELOPMENT_TOKEN:false}
recovery.frontend-url=${RECOVERY_FRONTEND_URL:http://localhost:5174/recovery}
recovery.mail-from=${RECOVERY_MAIL_FROM:${spring.mail.username:}}
recovery.mail-from-name=${RECOVERY_MAIL_FROM_NAME:Schedora}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
platform.admin.email=${PLATFORM_ADMIN_EMAIL:}
platform.admin.password=${PLATFORM_ADMIN_PASSWORD:}
