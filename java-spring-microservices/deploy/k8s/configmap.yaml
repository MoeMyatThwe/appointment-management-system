apiVersion: v1
kind: ConfigMap
metadata:
  name: appointment-config
data:
  IMAGE_REGISTRY: ghcr.io/replace-with-your-owner
  IMAGE_TAG: replace-with-release-tag
  AUTH_DB_URL: jdbc:postgresql://managed-auth-postgres:5432/auth-service-db
  APPOINTMENT_DB_URL: jdbc:postgresql://managed-appointment-postgres:5432/appointment-service-db
  KAFKA_BOOTSTRAP_SERVERS: managed-kafka:9092
  CORS_ALLOWED_ORIGINS: https://appointments.example.com
  FRONTEND_API_BASE_URL: https://api.appointments.example.com
  EMAIL_PROVIDER: none
  SMS_PROVIDER: none
  CALENDAR_PROVIDER: none
  EMAIL_WEBHOOK_URL: ""
  SMS_WEBHOOK_URL: ""
  CALENDAR_WEBHOOK_URL: ""
  REMINDER_MINUTES_BEFORE: "1440"
