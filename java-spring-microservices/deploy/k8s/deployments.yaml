          readinessProbe: { httpGet: { path: /actuator/health, port: 4004 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 4004 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, allowPrivilegeEscalation: false }
---
