apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appointment-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.appointments.example.com]
      secretName: appointment-api-tls
    - hosts: [appointments.example.com]
      secretName: appointment-frontend-tls
  rules:
    - host: api.appointments.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 4004 }
    - host: appointments.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
