services:
  auth-service-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  appointment-service-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  notification-service-db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  auth-service:
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL must be set}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:missing"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  billing-service:
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  appointment-service:
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${APPOINTMENT_DATABASE_URL:?APPOINTMENT_DATABASE_URL must be set}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:missing"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  analytics-service:
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  notification-service:
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${NOTIFICATION_DATABASE_URL:-${APPOINTMENT_DATABASE_URL:?APPOINTMENT_DATABASE_URL must be set}}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-none}
      NOTIFICATION_SMS_PROVIDER: ${NOTIFICATION_SMS_PROVIDER:-none}
      NOTIFICATION_CALENDAR_PROVIDER: ${NOTIFICATION_CALENDAR_PROVIDER:-none}
      NOTIFICATION_EMAIL_WEBHOOK_URL: ${NOTIFICATION_EMAIL_WEBHOOK_URL:-}
      NOTIFICATION_EMAIL_API_KEY: ${NOTIFICATION_EMAIL_API_KEY:-}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
      NOTIFICATION_SMS_WEBHOOK_URL: ${NOTIFICATION_SMS_WEBHOOK_URL:-}
      NOTIFICATION_CALENDAR_WEBHOOK_URL: ${NOTIFICATION_CALENDAR_WEBHOOK_URL:-}
      NOTIFICATION_REMINDER_MINUTES_BEFORE: ${NOTIFICATION_REMINDER_MINUTES_BEFORE:-1440}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set}
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
