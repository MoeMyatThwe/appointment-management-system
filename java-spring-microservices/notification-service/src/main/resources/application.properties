spring.application.name=notification-service
server.port=4003
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/notification-service-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:notification}
spring.flyway.schemas=${DB_SCHEMA:notification}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.kafka.consumer.group-id=notification-service
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
notification.email.provider=none
notification.sms.provider=none
notification.calendar.provider=none
notification.email.webhook-url=
notification.sms.webhook-url=
notification.calendar.webhook-url=
notification.reminder-minutes-before=1440
notification.reminder-poll-ms=${NOTIFICATION_REMINDER_POLL_MS:30000}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
auth.service.url=${AUTH_SERVICE_URL:http://localhost:4005}
internal.service-key=${INTERNAL_SERVICE_KEY:}
